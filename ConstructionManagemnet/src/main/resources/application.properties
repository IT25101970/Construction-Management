spring.application.name=Construction_Management
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buildtrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jackson.time-zone=UTC

app.seed-demo=${SEED_DEMO:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
app.bootstrap-admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
