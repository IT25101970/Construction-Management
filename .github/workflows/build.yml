name: Build and test
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConstructionManagemnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash ./mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ConstructionManagemnet/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ConstructionManagemnet/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
